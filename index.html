<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcuroute</title>
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* カラー設定 */
            --col-up: #F4900C;
            --col-down: #33CC33;
            --col-right: #0070C0;
            --col-left: #DD2E44;

            --player-navy: #003366;
            --player-light-navy: #D6DCE5;

            --hl-up: #FFF3E0;
            --hl-down: #E8F5E9;
            --hl-right: #E3F2FD;
            --hl-left: #FFEBEE;
            
            --hl-item: #FCE4EC;
            --text-hl-item: #C2185B;

            --text-hl-up: #E65100;
            --text-hl-down: #1B5E20;
            --text-hl-right: #0D47A1;
            --text-hl-left: #B71C1C;

            --item-purple: #BA68C8; 

            --bg-color: #f0f2f5;
            --board-bg: #ccc;
            --cell-bg: #fff;
            
            /* レイアウト設定 */
            --cell-size: 60px;
            --gap: 6px;
            --board-padding: 8px;
            
            --radius-cell: 6px; 
            --radius-board: calc(var(--radius-cell) + var(--board-padding));

            --num-font-size: 1.3rem;
            
            /* 全体の幅計算: 45+8+340+8+45 = 446px */
            --total-width: 446px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden; 
        }

        h1 {
            margin-bottom: 15px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--player-navy);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 上級モード表示用の赤い菱形 (メニュー画面用) */
        .advanced-mark {
            color: var(--col-left); /* 赤色 */
            font-size: 1.2rem;
            line-height: 1;
            margin-top: 5px;
            height: 1.2rem; 
            opacity: 1;
            transition: opacity 0.3s;
        }
        .advanced-mark.hidden {
            opacity: 0;
            display: block !important; 
            visibility: hidden;
        }

        /* --- 共通フォント設定 --- */
        .info-value, .cell.goal, .player-piece, .status-icon, .history-item, .score-value, .item-label, .mode-display, .timer-value {
            font-family: 'Arial', sans-serif;
        }
        .integer-val { font-size: 1.5rem; font-weight: 600; }
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            line-height: 1;
            font-family: 'Arial', sans-serif;
            font-size: var(--num-font-size);
        }
        .numerator {
            border-bottom: 2px solid currentColor;
            padding-bottom: 1px;
            text-align: center;
            width: 100%;
            font-size: 0.75em; 
            font-weight: 700;
            padding-left: 4px; padding-right: 4px; box-sizing: border-box;
        }
        .denominator {
            padding-top: 1px;
            text-align: center;
            width: 100%;
            font-size: 0.75em;
            font-weight: 700;
            padding-left: 4px; padding-right: 4px; box-sizing: border-box;
        }

        /* --- 画面切り替え用 --- */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s;
            transform-origin: top center; 
            width: var(--total-width);
            box-sizing: border-box;
            flex-shrink: 0; 
        }
        .hidden { display: none !important; }

        /* --- メニュー画面 --- */
        #menu-screen { gap: 15px; }
        
        .menu-title {
            font-size: 3rem;
            color: var(--player-navy);
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .menu-btn-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
            margin-top: 5px;
        }

        .menu-btn {
            flex: 1;
            width: auto;
            padding: 20px 0;
            font-size: 1.5rem;
            border-radius: 50px;
            background-color: white;
            color: var(--player-navy);
            border: 3px solid var(--player-navy);
            box-shadow: none; 
            transition: transform 0.1s, background-color 0.2s, color 0.2s;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-btn:hover {
            background-color: var(--player-navy);
            color: white;
            transform: translateY(-3px);
        }
        .menu-btn:active { transform: translateY(0); }

        /* --- トグルスイッチエリア --- */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .toggle-label {
            font-size: 1rem;
            font-weight: 700;
            color: #7f8c8d;
            font-family: 'Noto Sans JP', sans-serif;
            transition: color 0.3s;
        }
        .toggle-label.active {
            color: var(--player-navy);
        }
        .toggle-label.active-advanced {
            color: var(--col-left);
        }

        /* スイッチ本体 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--col-left); /* 赤色 */
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* --- ヘッダーコンテナ --- */
        .header-container {
            width: 100%; 
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-bottom: 20px;
            gap: 8px; 
            height: 90px;
            box-sizing: border-box;
        }

        /* 左側：情報パネル */
        .info-panel {
            flex: 1; 
            background: white;
            border-radius: var(--radius-board);
            box-shadow: none;
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            padding: 12px 8px; 
            box-sizing: border-box;
            gap: 0;
        }

        /* 右側：ボタンエリア */
        .controls-side {
            width: 85px; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        button {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-ctrl-btn {
            flex: 1;
            padding: 0;
            font-size: 0.8rem;
            background-color: #7f8c8d;
            color: white;
            border-radius: 12px;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: none;
        }
        .game-ctrl-btn:hover { background-color: #636e72; transform: translateY(-1px); }
        .game-ctrl-btn:active { transform: translateY(0); }

        .btn-reset { background-color: #7f8c8d; }
        .btn-reset:hover { background-color: #636e72; }

        .back-btn-container {
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: center; 
            align-items: center; 
            margin-bottom: 10px;
            position: relative; 
            box-sizing: border-box;
        }
        .btn-back {
            position: absolute; 
            left: 0;
            background: transparent;
            color: #888;
            font-size: 1rem;
            padding: 5px 10px;
            border: 2px solid #ccc;
            border-radius: 20px;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-back:hover {
            background: #eee;
            color: #555;
        }
        
        .mode-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--player-navy);
            font-family: sans-serif; 
            text-transform: none; 
            letter-spacing: 0;
        }

        /* --- パネル内部 --- */
        .status-label, .moves-label, .score-label, .timer-label, .items-label, .history-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            height: 1em;
            line-height: 1;
            text-align: center;
            width: 100%;
            text-transform: uppercase;
        }

        /* 4つのセクションの比率調整 */
        .progress-section {
            flex: 1.6;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 2px; 
        }

        .status-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            font-size: 1.1rem;
            font-weight: 700;
            box-sizing: border-box;
        }

        .current-icon {
            background-color: var(--player-navy);
            color: white;
            border-radius: 50%;
            border: 3px solid transparent;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .arrow-container {
            display: flex;
            align-items: center;
            height: 44px;
            margin-top: 15px;
        }

        .arrow-icon {
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .target-icon {
            background-color: #CC9900;
            color: #fff;
            border: 2px solid #997300;
            border-radius: var(--radius-cell);
        }

        /* MOVES表示の調整 */
        .moves-section {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            border: none; 
            padding: 0 4px;
            height: 100%;
        }
        
        .moves-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px; 
            margin-top: 0; 
        }

        .move-dot {
            width: 20px;
            height: 20px;
            background-color: var(--player-light-navy);
            border-radius: 0;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 11px;
            line-height: 1;
        }

        .move-dot.active {
            background-color: var(--player-navy);
        }

        /* ScoreとTimerのスタイル */
        .score-section, .timer-section {
            flex: 1.0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            border: none; 
            padding: 0 2px;
            height: 100%;
        }
        
        .timer-section {
            border-left: none;
            border-right: none; 
        }
        
        /* 比率再調整 */
        .info-panel.has-timer .timer-section { flex: 0.9; }
        .info-panel.has-timer .progress-section { flex: 1.4; }
        .info-panel.has-timer .moves-section { flex: 1.3; } 
        .info-panel.has-timer .score-section { flex: 1.0; }

        .score-value, .timer-value {
            font-weight: 700; 
            font-size: 1.8rem;
            color: #333333;
            width: 100%;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 5px; 
            margin: 0;
            line-height: 1;
        }
        
        .timer-value {
            font-size: 1.6rem;
            color: var(--player-navy);
        }
        
        .timer-value.warning {
            color: #DD2E44;
        }

        /* --- ゲームエリア --- */
        .game-wrapper {
            display: grid;
            grid-template-areas:
                ". top ."
                "left board right"
                ". bottom .";
            grid-template-columns: 45px auto 45px;
            grid-template-rows: 45px auto 45px;
            gap: 8px;
            box-sizing: border-box; 
            width: 100%; 
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900; 
            border-radius: var(--radius-board);
            line-height: 1;
            padding-bottom: 2px; 
            box-sizing: border-box;
        }
        .bar-top    { grid-area: top;    background-color: var(--col-up); }
        .bar-bottom { grid-area: bottom; background-color: var(--col-down); }
        .bar-left   { grid-area: left;   background-color: var(--col-left); }
        .bar-right  { grid-area: right;  background-color: var(--col-right); }

        /* 共通盤面スタイル */
        .board-common {
            grid-area: board;
            position: relative;
            width: 340px; 
            height: 340px;
            background-color: var(--board-bg);
            border-radius: var(--radius-board);
            box-sizing: border-box;
        }
        
        /* UIレイヤー (盤面に重ねる) */
        .ui-layer {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-board);
            pointer-events: none; /* 下のセルをクリックできるように */
            z-index: 50;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 盤面本体 */
        #game-board {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
        }

        .cell {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--cell-bg);
            border-radius: var(--radius-cell);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.2s;
        }

        .cell.goal {
            background-color: #CC9900;
            color: #fff;
            border: 2px solid #997300;
            box-sizing: border-box;
        }

        .player-piece {
            position: absolute;
            width: 48px;
            height: 48px;
            margin: 6px; 
            background-color: var(--player-navy);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1.0),
                        background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
            border: 3px solid transparent; 
            box-sizing: border-box;
        }

        .player-piece.selected {
            transform: scale(1.1);
            background-color: var(--player-light-navy);
            color: var(--player-navy);
            border-color: var(--player-navy);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .cell.highlight { cursor: pointer; }
        .cell.hl-up { background-color: var(--hl-up); color: var(--text-hl-up); }
        .cell.hl-down { background-color: var(--hl-down); color: var(--text-hl-down); }
        .cell.hl-left { background-color: var(--hl-left); color: var(--text-hl-left); }
        .cell.hl-right { background-color: var(--hl-right); color: var(--text-hl-right); }
        
        .cell.hl-item {
            background-color: var(--cell-bg) !important;
            color: #333 !important;
            box-shadow: inset 0 0 0 4px var(--item-purple) !important;
        }
        
        .cell.goal.hl-item {
            background-color: #CC9900 !important;
            color: #fff !important;
            box-shadow: inset 0 0 0 4px var(--item-purple) !important;
            border: 2px solid #997300 !important;
        }

        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }
        .p-sym {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            margin-right: 1px;
            position: relative; top: 1px;
        }
        .p-num {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            position: relative; top: -1px; 
        }

        .cell-content { z-index: 1; }

        /* アイテムアイコン */
        .item-icon {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2; 
            pointer-events: none;
        }
        .item-shape {
            color: var(--item-purple);
            font-size: 1.8rem;
            line-height: 1;
            position: relative;
            top: -1px; 
        }
        .item-mark {
            position: absolute;
            color: white;
            font-size: 1.0rem;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cell.highlight .item-mark { display: none; }
        .cell.highlight .item-shape { opacity: 0.3; }

        /* アイテム枠 */
        #item-container {
            margin: 15px auto 0 auto;
            width: 96%; /* 変更: 100% -> 96% に縮小 */
            background: white;
            border-radius: var(--radius-board);
            border: 2px solid var(--item-purple); 
            padding: 10px; 
            box-sizing: border-box;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #item-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px; /* 変更: 4px -> 2px に縮小 */
            width: 100%;
        }

        .item-slot {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 6px;
            border: 2px solid var(--item-purple);
            background-color: #f9f9f9;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            padding: 1px; /* 変更: 2px -> 1px に縮小 */
        }
        
        .item-slot:active { transform: scale(0.95); }
        .item-slot.active {
            border: 3px solid var(--player-navy);
            background-color: #e3f2fd;
        }
        
        /* アイテムバッジスタイル: 枠いっぱいに広げる */
        .item-badge {
            width: 100%;  
            height: 100%; 
            border-radius: 4px; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 1.0rem;
            line-height: 1;
            padding-bottom: 0; 
            box-sizing: border-box;
        }
        
        .item-move { background-color: #7f8c8d; }
        .item-plus { background-color: var(--col-right); }
        .item-minus { background-color: var(--col-left); }
        .item-mul { background-color: var(--col-up); }
        .item-div  { background-color: var(--col-down); } 
        .item-reset { background-color: #CC0099; }

        /* 記号サイズ調整用 */
        .op-symbol {
            font-size: 0.85em;
            vertical-align: 0.05em; 
        }

        /* --- アイテムグラフィック用CSS --- */
        .item-graphic {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* M-1: Line (50%に短縮) */
        .graphic-line-vert {
            width: 4px;
            height: 50%;
            background-color: white;
            position: relative;
            border-radius: 2px;
        }
        .graphic-line-vert::before, .graphic-line-vert::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
        }
        .graphic-line-vert::before {
            top: -4px;
            border-bottom: 8px solid white;
        }
        .graphic-line-vert::after {
            bottom: -4px;
            border-top: 8px solid white;
        }

        .graphic-line-hori {
            width: 50%;
            height: 4px;
            background-color: white;
            position: relative;
            border-radius: 2px;
        }
        .graphic-line-hori::before, .graphic-line-hori::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }
        .graphic-line-hori::before {
            left: -4px;
            border-right: 8px solid white;
        }
        .graphic-line-hori::after {
            right: -4px;
            border-left: 8px solid white;
        }

        /* M-2: Octagon (変更: 22.5度回転して頂点をずらす) */
        .octagon-container {
            width: 70%;
            height: 70%;
            position: relative;
            margin: auto;
            transform: rotate(22.5deg); /* 追加: 45度だと重なるため22.5度で見た目を変える */
        }
        .octagon-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* 頂点座標計算 (半径50%の円周上) */
        .o-pos-0 { top: 0%;    left: 50%; }   /* 上 */
        .o-pos-1 { top: 14.7%; left: 85.3%; } /* 右上 */
        .o-pos-2 { top: 50%;   left: 100%; }  /* 右 */
        .o-pos-3 { top: 85.3%; left: 85.3%; } /* 右下 */
        .o-pos-4 { top: 100%;  left: 50%; }   /* 下 */
        .o-pos-5 { top: 85.3%; left: 14.7%; } /* 左下 */
        .o-pos-6 { top: 50%;   left: 0%; }    /* 左 */
        .o-pos-7 { top: 14.7%; left: 14.7%; } /* 左上 */
        
        .o-pos-center { 
            top: 50%; left: 50%; 
            width: 8px; height: 8px; /* 中心だけ少し大きく */
        }

        /* M-3: Warp (矢印削除に伴いシンプルに) */
        .warp-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: white;
            font-weight: 900;
            font-size: 1.8rem; /* ？を大きく */
            line-height: 1;
        }
        
        /* M-4: Bishop */
        .bishop-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bishop-cross {
            position: absolute;
            width: 80%;
            height: 4px;
            background-color: white;
            border-radius: 2px;
        }
        .bishop-cross.cw { transform: rotate(45deg); }
        .bishop-cross.ccw { transform: rotate(-45deg); }
        
        .bishop-cross::before, .bishop-cross::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }
        .bishop-cross::before {
            left: -3px;
            border-right: 7px solid white;
        }
        .bishop-cross::after {
            right: -3px;
            border-left: 7px solid white;
        }

        /* 履歴 */
        #history-container {
            margin: 15px auto 0 auto;
            width: 100%; 
            background: white;
            border-radius: var(--radius-board);
            border: 2px solid #555;
            padding: 10px; 
            box-sizing: border-box;
            box-shadow: none;
            min-height: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #history-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            width: 100%;
            min-height: 38px; 
        }

        .history-item {
            width: 38px;  
            height: 38px; 
            margin: 0 auto; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            line-height: 1;
            box-sizing: border-box;
        }

        .h-sym {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 0.7rem; 
            margin-right: 1px;
            position: relative; top: 0px;
        }
        .h-num {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 0.9rem; 
            position: relative; top: 0px;
        }

        .hist-right {
            background-color: var(--col-right);
            clip-path: polygon(0% 0%, 85% 0%, 100% 50%, 85% 100%, 0% 100%, 15% 50%);
            padding-right: 1px;
            padding-bottom: 2px;
        }
        .hist-left {
            background-color: var(--col-left);
            clip-path: polygon(15% 0%, 100% 0%, 85% 50%, 100% 100%, 15% 100%, 0% 50%);
            padding-right: 5px;
            padding-bottom: 2px;
        }
        .hist-up {
            background-color: var(--col-up);
            clip-path: polygon(50% 0%, 100% 15%, 100% 100%, 50% 85%, 0% 100%, 0% 15%);
            padding-top: 2%; 
            padding-bottom: 5px;
        }
        .hist-down {
            background-color: var(--col-down);
            clip-path: polygon(0% 0%, 50% 15%, 100% 0%, 100% 85%, 50% 100%, 0% 85%);
            padding-bottom: 4px;
            padding-top: 5px;
        }

        /* --- モード選択オーバーレイ (盤面内) --- */
        #mode-select-overlay {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            pointer-events: auto; /* 操作可能にする */
            position: absolute;
            top: 0; left: 0;
            z-index: 100;
        }
        
        .overlay-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .mode-btn {
            width: 75%;
            padding: 12px 0;
            font-size: 1.1rem;
            border-radius: 25px;
            background-color: white;
            color: var(--player-navy);
            border: 2px solid transparent;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .mode-btn:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }
        
        /* Cancelボタン用スタイル（ボタンは削除しましたが、CSSは残しても害はありません） */
        .mode-btn-cancel {
            width: 40%;
            padding: 8px 0;
            font-size: 0.9rem;
            background: transparent;
            border: 1px solid #888;
            color: #ccc;
            margin-top: 10px;
        }

        /* --- カウントダウン表示 --- */
        #countdown-overlay {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
            z-index: 110;
            pointer-events: auto; /* クリックブロック */
        }
        .countdown-text {
            color: #FFF;
            font-size: 8rem; /* 大きく変更 */
            font-weight: 700; /* 太く変更 */
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-family: 'Arial', sans-serif; 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            width: 100%;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- メッセージ帯（盤面内のみ） --- */
        #message {
            position: absolute;
            width: 100%;
            height: auto;
            min-height: 80px; 
            background: rgba(0, 51, 102, 0.9);
            padding: 10px 0; 
            display: none;
            text-align: center;
            box-shadow: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            z-index: 100;
        }
        
        #message.gameover {
            background: rgba(180, 0, 0, 0.9); 
        }
        
        #message.timeup {
            background: rgba(235, 90, 0, 0.9); /* 赤っぽいオレンジ */
        }
        
        .msg-text {
            font-size: 3rem;
            color: white;
            font-weight: 400; 
            letter-spacing: 0.1em;
            font-family: 'Arial', sans-serif;
            line-height: 1;
            margin: 0;
            margin-top: 6px; 
        }

        .msg-subtext {
            font-size: 1.5rem;
            color: white;
            font-weight: 700;
            font-family: 'Arial', sans-serif;
        }

        .msg-btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .btn-retry {
            padding: 10px 25px;
            font-size: 1.0rem;
            background-color: white;
            color: var(--player-navy);
            border-radius: 30px;
            font-weight: 400; 
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
            font-family: 'Arial', sans-serif;
        }
        .btn-retry:hover { transform: scale(1.05); }

        /* シェアボタン（黒色） */
        #btn-share-x {
            background-color: #000;
            color: #fff;
        }
        #btn-share-x:hover {
            background-color: #333;
        }

    </style>
</head>
<body>

    <div id="menu-screen" class="screen">
        <h1 class="menu-title">
            Calcuroute
            <div id="advanced-mark" class="advanced-mark hidden">◆</div>
        </h1>
        
        <div class="game-wrapper">
            <div class="bar bar-top">×</div>

                <button class="game-ctrl-btn" onclick="initGame()">NEW GAME</button>
                <button class="game-ctrl-btn btn-reset" onclick="resetGame()">RESET</button>

        <div class="game-wrapper">
            <div class="bar bar-top">×</div>
            <div class="bar bar-left">－</div>
            
            <div class="board-common">
                <div id="game-board"></div>

                <div id="ui-layer" class="ui-layer">
                    <div id="mode-select-overlay">
                        <div class="overlay-title">Select Mode</div>
                        <button class="mode-btn" onclick="startArcadeGame('endless')">Endless (∞)</button>
                        <button class="mode-btn" onclick="startArcadeGame('timed')">Time Attack (300s)</button>
                    </div>

                        <div id="countdown-text" class="countdown-text">3</div>
                    </div>

                        <div class="msg-text" id="msg-main">CLEAR!</div>
                        <div class="msg-subtext" id="msg-sub"></div>
                        <div class="msg-btn-container">
                            <button class="btn-retry hidden" id="btn-retry-game" onclick="restartArcade()">RETRY</button>

                </div>

            <div class="history-label">LOG</div>
            <div id="history-grid"></div>
        </div>
