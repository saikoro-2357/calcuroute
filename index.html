    <script>
        // --- 画面遷移ロジック ---
        let currentGameMode = 'normal'; 
        let arcadeType = 'endless'; // 'endless' or 'timed'
        let timerInterval = null;
        let countdownInterval = null; // カウントダウン用ID管理
        let timeLeft = 300; // 300秒
        let isCountingDown = false; // カウントダウン中は操作ブロック
        let isAdvancedMode = false; // 上級モードフラグ

        function showMenu() {
            stopTimer(); // タイマー停止
            if(countdownInterval) clearInterval(countdownInterval); // カウントダウン停止
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('message').style.display = 'none'; 
            document.getElementById('mode-select-overlay').style.display = 'none'; 
            document.getElementById('countdown-overlay').style.display = 'none';
            isCountingDown = false;
            resetGameScale(); 
        }
        
        function toggleAdvancedMode() {
            const toggle = document.getElementById('advanced-switch');
            isAdvancedMode = toggle.checked;
            
            const mark = document.getElementById('advanced-mark');
            const lblNormal = document.getElementById('lbl-normal');
            const lblAdvanced = document.getElementById('lbl-advanced');

            if (isAdvancedMode) {
                mark.classList.remove('hidden');
                lblNormal.classList.remove('active');
                lblAdvanced.classList.add('active', 'active-advanced');
            } else {
                mark.classList.add('hidden');
                lblNormal.classList.add('active');
                lblAdvanced.classList.remove('active', 'active-advanced');
            }
        }

        // ★追加: モードタイトルを設定するヘルパー関数
        function setModeTitle(titleText) {
            const el = document.getElementById('mode-display');
            let html = titleText;
            if (isAdvancedMode) {
                // 上級モードなら赤い◆を追加
                html += ' <span style="color: var(--col-left); margin-left: 4px; font-size: 0.8em; vertical-align: 2px;">◆</span>';
            }
            el.innerHTML = html;
        }
        
        function prepareArcadeMode() {
            // Arcade画面へ遷移し、初期盤面を生成してからオーバーレイを表示
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            if(countdownInterval) clearInterval(countdownInterval);
            isCountingDown = false;
            document.getElementById('countdown-overlay').style.display = 'none';

            currentGameMode = 'arcade';
            
            // UI調整
            document.getElementById('item-container').classList.remove('hidden');
            document.getElementById('controls-side').classList.add('hidden');
            document.getElementById('score-section').classList.remove('hidden'); 
            
            // 変更点: タイマーセクションを表示し、レイアウトを調整、'?'を表示
            document.getElementById('timer-section').classList.remove('hidden');
            document.getElementById('info-panel').classList.add('has-timer');
            
            timerValEl.textContent = '?';
            timerValEl.style.fontFamily = "'Noto Sans JP', sans-serif";
            timerValEl.classList.remove('warning');

            // ★変更: ヘルパー関数を使用
            setModeTitle('Arcade');
            
            initGame(false); // false = ゲーム開始せず盤面だけ描画

            // オーバーレイ表示
            document.getElementById('mode-select-overlay').style.display = 'flex';
            resizeGame();
        }

        function startNormalMode() {
            currentGameMode = 'normal';
            if(countdownInterval) clearInterval(countdownInterval);
            isCountingDown = false;

            document.getElementById('item-container').classList.add('hidden');
            document.getElementById('controls-side').classList.remove('hidden');
            document.getElementById('score-section').classList.add('hidden'); 
            document.getElementById('timer-section').classList.add('hidden');
            document.getElementById('info-panel').classList.remove('has-timer');
            
            // ★変更: ヘルパー関数を使用
            setModeTitle('Simple');
            
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('mode-select-overlay').style.display = 'none';
            document.getElementById('countdown-overlay').style.display = 'none';
            
            initGame();
            resizeGame(); 
        }

        function startArcadeGame(type) {
            arcadeType = type;
            document.getElementById('mode-select-overlay').style.display = 'none';
            
            if(countdownInterval) clearInterval(countdownInterval);
            isCountingDown = false;
            
            // どちらのモードでもタイマーエリアを表示
            document.getElementById('timer-section').classList.remove('hidden');
            document.getElementById('info-panel').classList.add('has-timer');

            if (arcadeType === 'timed') {
                // ★変更: ヘルパー関数を使用
                setModeTitle('Arcade 300');
                
                // カウントダウン開始前から300を表示
                timeLeft = 300;
                timerValEl.style.fontFamily = "'Arial', sans-serif";
                updateTimerDisplay(); // これで300が表示される
                
                runCountdown(() => {
                    // カウントダウン終了後の処理:
                    // 盤面は prepareArcadeMode で生成されたものを維持。
                    // タイマーのみ開始する。
                    startTimer(); 
                });
            } else {
                // ★変更: ヘルパー関数を使用
                setModeTitle('Arcade ∞');
                stopTimer();
                // ∞を表示
                timerValEl.textContent = '∞';
                timerValEl.style.fontFamily = "'Noto Sans JP', sans-serif";
                timerValEl.classList.remove('warning');
                // 盤面は維持
            }
        }
        
        function runCountdown(callback) {
            isCountingDown = true;
            const overlay = document.getElementById('countdown-overlay');
            const text = document.getElementById('countdown-text');
            overlay.style.display = 'flex';
            
            let count = 3;
            text.textContent = count;
            
            // カウントダウン用のインターバル
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    text.textContent = count;
                    // アニメーションリセット
                    text.style.animation = 'none';
                    text.offsetHeight; /* trigger reflow */
                    text.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                } else if (count === 0) {
                    text.textContent = "GO";
                    text.style.animation = 'none';
                    text.offsetHeight;
                    text.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                } else {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    overlay.style.display = 'none';
                    isCountingDown = false;
                    if (callback) callback();
                }
            }, 1000);
        }
        
        // --- スマホ用画面サイズ調整 ---
        function resizeGame() {
            const gameScreen = document.getElementById('game-screen');
            const menuScreen = document.getElementById('menu-screen');
            const totalWidth = 446; 
            const windowWidth = window.innerWidth;
            
            const scale = (windowWidth < totalWidth + 20) ? (windowWidth - 20) / totalWidth : 1;
            
            if (scale < 1) {
                gameScreen.style.transform = `scale(${scale})`;
                menuScreen.style.transform = `scale(${scale})`;
            } else {
                gameScreen.style.transform = 'none';
                menuScreen.style.transform = 'none';
            }
        }
        
        function resetGameScale() {
            resizeGame(); 
        }

        window.addEventListener('resize', () => {
             resizeGame();
        });
        
        // グローバル変数追加
        let menuPlayerPieceEl = null;

        window.onload = function() {
            initMenuBoard();
            updateMenuBoard();
            resizeGame();
        };

        // --- 数学ユーティリティ ---
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function simplify(n, d) {
            if (d === 0) return { n: 0, d: 1 };
            if (d < 0) { n = -n; d = -d; }
            const common = Math.abs(gcd(n, d));
            return { n: n / common, d: d / common };
        }
        function createFrac(n, d = 1) { return simplify(n, d); }
        function add(f, val) { return simplify(f.n + val * f.d, f.d); }
        function sub(f, val) { return simplify(f.n - val * f.d, f.d); }
        function mul(f, val) { return simplify(f.n * val, f.d); }
        function div(f, val) { return simplify(f.n, f.d * val); }
        function isEqual(f1, f2) { return f1.n === f2.n && f1.d === f2.d; }
        function isInteger(f) { return f.d === 1; }

        // --- ゲーム定数・変数 ---
        const BOARD_SIZE = 5;
        const CELL_SIZE = 60;
        const GAP = 6;
        const PADDING = 8;
        
        let player = { x: 0, y: 0, val: {n:0, d:1} };
        let initialPlayerState = { x: 0, y: 0, val: {n:0, d:1} };
        let goal = { x: 0, y: 0, val: {n:0, d:1} };
        
        // Menu variables
        let menuPlayer = { x: 2, y: 2, val: { n: 1, d: 1 } };
        let isMenuPlayerSelected = false;

        let moveCount = 0; 
        let remainingMoves = 8; 
        let score = 0; 

        // アイテム管理
        let itemsOnBoard = []; 
        let playerItems = [];
        let activeItemIndex = -1;

        let isGameClear = false;
        let isGameOver = false;
        let isPlayerSelected = false;

        const boardEl = document.getElementById('game-board');
        const currentIconEl = document.getElementById('current-val-icon');
        const targetIconEl = document.getElementById('target-val-icon');
        const movesGridEl = document.getElementById('moves-grid');
        const historyGridEl = document.getElementById('history-grid');
        const messageEl = document.getElementById('message');
        const msgMainEl = document.getElementById('msg-main');
        const msgSubEl = document.getElementById('msg-sub');
        const btnRetryEl = document.getElementById('btn-retry-game');
        const btnShareEl = document.getElementById('btn-share-x');
        const scoreValEl = document.getElementById('score-val');
        const itemGridEl = document.getElementById('item-grid');
        const timerValEl = document.getElementById('timer-val');
        
        let playerPieceEl = null;

        function renderNumberToHTML(f) {
            if (f.d === 1) {
                return `<span class="integer-val">${f.n}</span>`;
            } else {
                return `<div class="fraction">
                            <span class="numerator">${f.n}</span>
                            <span class="denominator">${f.d}</span>
                        </div>`;
            }
        }

        function getItemIconHTML() {
            return `<div class="item-shape">◆<span class="item-mark">?</span></div>`;
        }
        
        // --- メニュー画面の盤面操作 ---
        function initMenuBoard() {
            const menuBoardEl = document.getElementById('menu-board');
            if(!menuBoardEl) return;
            menuBoardEl.innerHTML = '';

            // セル生成
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `menu-cell-${x}-${y}`; 
                    const left = PADDING + x * (CELL_SIZE + GAP);
                    const top = PADDING + y * (CELL_SIZE + GAP);
                    cell.style.left = `${left}px`;
                    cell.style.top = `${top}px`;
                    
                    cell.onclick = () => handleMenuCellClick(x, y);
                    
                    menuBoardEl.appendChild(cell);
                }
            }

            // コマ生成
            menuPlayerPieceEl = document.createElement('div');
            menuPlayerPieceEl.className = 'player-piece';
            menuPlayerPieceEl.onclick = (e) => {
                e.stopPropagation();
                isMenuPlayerSelected = !isMenuPlayerSelected;
                updateMenuBoard();
            };
            menuBoardEl.appendChild(menuPlayerPieceEl);
        }

        function handleMenuCellClick(x, y) {
            let validMoves = [];
            if (isMenuPlayerSelected) {
                validMoves = getValidMoves(menuPlayer.x, menuPlayer.y);
            }
            
            const move = validMoves.find(m => (menuPlayer.x + m.dx) === x && (menuPlayer.y + m.dy) === y);
            
            if (move) {
                executeMenuMove(x, y);
            } else {
                if(isMenuPlayerSelected) {
                    isMenuPlayerSelected = false;
                    updateMenuBoard();
                }
            }
        }

        function updateMenuBoard() {
            if (menuPlayerPieceEl) {
                const px = PADDING + menuPlayer.x * (CELL_SIZE + GAP);
                const py = PADDING + menuPlayer.y * (CELL_SIZE + GAP);
                const scale = isMenuPlayerSelected ? 'scale(1.1)' : 'scale(1)';
                menuPlayerPieceEl.style.transform = `translate(${px}px, ${py}px) ${scale}`;
                
                if (isMenuPlayerSelected) menuPlayerPieceEl.classList.add('selected');
                else menuPlayerPieceEl.classList.remove('selected');
                
                menuPlayerPieceEl.innerHTML = renderNumberToHTML(menuPlayer.val);
            }

            let highlightMap = new Map();
            if (isMenuPlayerSelected) {
                let moves = getValidMoves(menuPlayer.x, menuPlayer.y);
                moves.forEach(move => {
                    let tx = menuPlayer.x + move.dx;
                    let ty = menuPlayer.y + move.dy;
                    let dist = Math.abs(move.dx + move.dy);
                    let symbol = "", colorClass = "";
                    if (move.dy < 0) { colorClass = 'hl-up'; symbol = "×"; }
                    else if (move.dy > 0) { colorClass = 'hl-down'; symbol = "÷"; }
                    else if (move.dx > 0) { colorClass = 'hl-right'; symbol = "＋"; }
                    else if (move.dx < 0) { colorClass = 'hl-left'; symbol = "－"; }
                    highlightMap.set(`${tx},${ty}`, { symbol, number: dist, colorClass });
                });
            }

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.getElementById(`menu-cell-${x}-${y}`);
                    if(!cell) continue;
                    
                    cell.className = 'cell';
                    cell.innerHTML = ''; 

                    const hl = highlightMap.get(`${x},${y}`);
                    if (hl) {
                        cell.classList.add('highlight', hl.colorClass);
                        
                        const previewDiv = document.createElement('div');
                        previewDiv.className = 'preview-overlay';
                        if (hl.symbol) {
                            const symSpan = document.createElement('span');
                            symSpan.className = 'p-sym';
                            symSpan.textContent = hl.symbol;
                            const numSpan = document.createElement('span');
                            numSpan.className = 'p-num';
                            numSpan.textContent = hl.number;
                            previewDiv.appendChild(symSpan);
                            previewDiv.appendChild(numSpan);
                        }
                        cell.appendChild(previewDiv);
                    }
                }
            }
        }

        function executeMenuMove(tx, ty) {
            let dx = tx - menuPlayer.x;
            let dy = ty - menuPlayer.y;
            let dist = Math.abs(dx + dy);
            
            if (dy < 0) menuPlayer.val = mul(menuPlayer.val, dist);
            else if (dy > 0) menuPlayer.val = div(menuPlayer.val, dist);
            else if (dx > 0) menuPlayer.val = add(menuPlayer.val, dist);
            else if (dx < 0) menuPlayer.val = sub(menuPlayer.val, dist);

            menuPlayer.x = tx;
            menuPlayer.y = ty;
            isMenuPlayerSelected = false;
            updateMenuBoard();
        }

        // --- アイテムデータ生成 ---
        function generateRandomItem() {
            const isMoveType = Math.random() < 0.5;
            let type = '';

            if (isMoveType) {
                const moveTypes = ['M-1', 'M-1', 'M-1', 'M-2', 'M-3', 'M-4'];
                type = moveTypes[Math.floor(Math.random() * moveTypes.length)];
            } else {
                const calcTypes = ['N-1', 'N-1', 'N-1', 'N-1', 'N-1', 'N-1', 'N-1', 'N-1', 'N-2'];
                type = calcTypes[Math.floor(Math.random() * calcTypes.length)];
            }
            
            let item = { type: type, label: '', sub: '', data: {} };

            switch(type) {
                case 'M-1':
                    const axes = ['VERT', 'HORI'];
                    const axis = axes[Math.floor(Math.random() * axes.length)];
                    item.data.axis = axis;
                    if(axis === 'VERT') item.label = '↕';
                    else item.label = '↔';
                    item.sub = 'Line';
                    break;
                case 'M-2':
                    item.label = '♞';
                    item.sub = 'Knight';
                    break;
                case 'M-3':
                    item.label = '？'; 
                    item.sub = 'Warp';
                    break;
                case 'M-4':
                    item.label = '♝';
                    item.sub = 'Bishop';
                    break;
                case 'N-1':
                    let ops;
                    if (isAdvancedMode) {
                        ops = [
                            {op:'+', v:2}, {op:'+', v:3}, {op:'+', v:4}, {op:'+', v:5}, {op:'+', v:6},
                            {op:'-', v:2}, {op:'-', v:3}, {op:'-', v:4}, {op:'-', v:5}, {op:'-', v:6},
                            {op:'*', v:2}, {op:'*', v:3},
                            {op:'/', v:2}
                        ];
                    } else {
                        ops = [
                            {op:'+', v:3}, {op:'+', v:4}, {op:'+', v:5},
                            {op:'-', v:3}, {op:'-', v:4}, {op:'-', v:5},
                            {op:'*', v:2}, {op:'*', v:3}
                        ];
                    }
                    
                    const op = ops[Math.floor(Math.random() * ops.length)];
                    item.data.op = op;
                    if(op.op === '*') item.label = '×' + op.v;
                    else if(op.op === '/') item.label = '÷' + op.v;
                    else item.label = op.op + op.v;
                    item.sub = 'Calc';
                    break;
                case 'N-2':
                    item.label = '=N';
                    item.sub = 'Reset';
                    break;
            }
            return item;
        }

        // --- タイマー関数 ---
        function startTimer() {
            stopTimer();
            timeLeft = 300; // 300秒
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    stopTimer();
                    gameOver('timeup');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timerValEl.textContent = timeLeft;
            if (timeLeft <= 30) timerValEl.classList.add('warning');
            else timerValEl.classList.remove('warning');
        }

        function initGame(startGameFlag = true) {
            isGameClear = false;
            isGameOver = false;
            isPlayerSelected = false;
            activeItemIndex = -1;
            messageEl.style.display = 'none';
            messageEl.classList.remove('gameover', 'timeup');
            btnRetryEl.classList.add('hidden');
            btnShareEl.classList.add('hidden'); 
            msgSubEl.textContent = '';
            historyGridEl.innerHTML = ''; 
            
            itemsOnBoard = [];
            playerItems = [];
            
            if (currentGameMode === 'normal') {
                moveCount = 0;
                score = 0;
                stopTimer();
            } else {
                remainingMoves = 8;
                score = 0;
                if (startGameFlag && arcadeType === 'timed') {
                    startTimer();
                } else {
                    stopTimer();
                    if (currentGameMode === 'arcade' && arcadeType === 'endless') {
                        timerValEl.textContent = '∞';
                        timerValEl.style.fontFamily = "'Noto Sans JP', sans-serif";
                        timerValEl.classList.remove('warning');
                    }
                }
            }
            
            while(!generateLevel()) {}
            
            if (currentGameMode === 'arcade') {
                spawnItems();
            }
            
            initialPlayerState = { 
                x: player.x, 
                y: player.y, 
                val: { n: player.val.n, d: player.val.d } 
            };

            createBoardDOM();
            updateBoardState();
            updateInfo();
            updateItems();
        }

        function resetGame() {
            if (isGameClear) messageEl.style.display = 'none'; 
            isGameClear = false;
            isPlayerSelected = false;
            activeItemIndex = -1;
            messageEl.classList.remove('gameover', 'timeup');
            
            if (currentGameMode === 'normal') {
                moveCount = 0;
            } else {
                remainingMoves = 8;
                score = 0;
                itemsOnBoard = [];
                playerItems = [];
                if (arcadeType === 'timed') {
                    startTimer(); 
                } else {
                    stopTimer();
                    timerValEl.textContent = '∞';
                    timerValEl.style.fontFamily = "'Noto Sans JP', sans-serif";
                    timerValEl.classList.remove('warning');
                }
            }
            historyGridEl.innerHTML = ''; 

            player = { 
                x: initialPlayerState.x, 
                y: initialPlayerState.y, 
                val: { n: initialPlayerState.val.n, d: initialPlayerState.val.d } 
            };
            
            if (currentGameMode === 'arcade') {
                itemsOnBoard = [];
                spawnItems();
            }

            updateBoardState();
            updateInfo();
            updateItems();
        }

        function restartArcade() {
            prepareArcadeMode();
        }

        function gameOver(reason = 'nomoves') {
            isGameOver = true;
            stopTimer();
            
            messageEl.classList.remove('gameover', 'timeup');

            if (reason === 'timeup') {
                msgMainEl.textContent = "TIME UP";
                messageEl.classList.add('timeup');
            } else {
                msgMainEl.textContent = "GAME OVER";
                messageEl.classList.add('gameover');
            }
            
            msgSubEl.textContent = `Score: ${score}`;
            msgSubEl.style.display = 'block'; 
            
            btnRetryEl.classList.remove('hidden');
            btnShareEl.classList.remove('hidden'); 
            
            messageEl.style.display = 'flex';
        }
        
        function shareToX() {
            let modeText = "Arcade ∞";
            if (arcadeType === 'timed') modeText = "Arcade 300";
            
            // ★追加: 上級モードなら◆を追加
            if (isAdvancedMode) {
                modeText += "◆";
            }
            
            const text = `Calcuroute ${modeText}\nScore:${score}\n#Calcuroute\nhttps://saikoro-2357.github.io/calcuroute/`;
            const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(shareUrl, '_blank');
        }

        // --- アイテムロジック ---
        function spawnItems() {
            let attempts = 0;
            while (itemsOnBoard.length < 4 && attempts < 100) {
                let rx = Math.floor(Math.random() * BOARD_SIZE);
                let ry = Math.floor(Math.random() * BOARD_SIZE);
                
                let conflict = false;
                if (rx === player.x && ry === player.y) conflict = true;
                if (rx === goal.x && ry === goal.y) conflict = true;
                for (let it of itemsOnBoard) {
                    if (it.x === rx && it.y === ry) conflict = true;
                }
                
                if (!conflict) {
                    itemsOnBoard.push({ x: rx, y: ry, type: '?' });
                }
                attempts++;
            }
        }

        function createMoveItemGraphic(item) {
            if (item.type === 'M-1') {
                // Line
                if (item.data.axis === 'VERT') {
                    return `<div class="item-graphic"><div class="graphic-line-vert"></div></div>`;
                } else {
                    return `<div class="item-graphic"><div class="graphic-line-hori"></div></div>`;
                }
            } else if (item.type === 'M-2') {
                // Knight -> Octagon (8角形 + 中心)
                // CSSで22.5度回転しているので、頂点位置もそれに追従する
                let html = `<div class="item-graphic"><div class="octagon-container">`;
                // 0~7: 頂点, 8: 中心
                for(let i=0; i<9; i++) {
                    let posClass = (i === 8) ? 'o-pos-center' : `o-pos-${i}`;
                    html += `<div class="octagon-dot ${posClass}"></div>`;
                }
                html += `</div></div>`;
                return html;
            } else if (item.type === 'M-3') {
                // Warp: 矢印を削除し「？」のみにする
                return `<div class="item-graphic"><div class="warp-container">？</div></div>`;
            } else if (item.type === 'M-4') {
                // Bishop
                return `<div class="item-graphic"><div class="bishop-container">
                    <div class="bishop-cross cw"></div>
                    <div class="bishop-cross ccw"></div>
                </div></div>`;
            }
            return '';
        }

        function updateItems() {
            itemGridEl.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = 'item-slot';
                if (i === activeItemIndex) slot.classList.add('active');
                
                if (i < playerItems.length) {
                    const it = playerItems[i];
                    
                    if (['M-1','M-2','M-3','M-4'].includes(it.type)) {
                        let bgClass = 'item-move';
                        const graphicHtml = createMoveItemGraphic(it);
                        slot.innerHTML = `<div class="item-badge ${bgClass}">${graphicHtml}</div>`;
                        
                    } else {
                        let bgClass = '';
                        if (it.type === 'N-2') bgClass = 'item-reset';
                        else if (it.type === 'N-1') {
                            if (it.data.op.op === '+') bgClass = 'item-plus';
                            else if (it.data.op.op === '-') bgClass = 'item-minus';
                            else if (it.data.op.op === '*') bgClass = 'item-mul';
                            else if (it.data.op.op === '/') bgClass = 'item-div';
                        }

                        let labelHtml = it.label.replace(/([×÷])/g, '<span class="op-symbol">$1</span>');
                        slot.innerHTML = `<div class="item-badge ${bgClass}">${labelHtml}</div>`;
                    }
                    
                    slot.onclick = (e) => {
                        e.stopPropagation(); 
                        handleItemClick(i);
                    };
                }
                itemGridEl.appendChild(slot);
            }
        }

        function handleItemClick(index) {
            if (isGameClear || isGameOver || isCountingDown) return;
            
            if (document.getElementById('mode-select-overlay').style.display === 'flex') return;

            if (activeItemIndex === index) {
                activeItemIndex = -1;
                updateBoardState();
                updateItems();
                return;
            }

            isPlayerSelected = false;
            activeItemIndex = index;
            
            const item = playerItems[index];
            
            if (['M-3', 'N-1', 'N-2'].includes(item.type)) {
                useInstantItem(index);
                activeItemIndex = -1;
            }
            
            updateBoardState();
            updateItems();
        }

        function useInstantItem(index) {
            const item = playerItems[index];
            let changed = false;

            if (item.type === 'M-3') {
                let emptySpots = [];
                for(let y=0; y<BOARD_SIZE; y++){
                    for(let x=0; x<BOARD_SIZE; x++){
                        if((x!==player.x || y!==player.y) && (x!==goal.x || y!==goal.y)){
                            emptySpots.push({x,y});
                        }
                    }
                }
                if(emptySpots.length > 0){
                    const p = emptySpots[Math.floor(Math.random()*emptySpots.length)];
                    player.x = p.x;
                    player.y = p.y;
                    changed = true;
                }
            } else if (item.type === 'N-1') {
                const op = item.data.op;
                if(op.op === '+') player.val = add(player.val, op.v);
                else if(op.op === '-') player.val = sub(player.val, op.v);
                else if(op.op === '*') player.val = mul(player.val, op.v);
                else if(op.op === '/') player.val = div(player.val, op.v);
                changed = true;
            } else if (item.type === 'N-2') {
                const maxR = isAdvancedMode ? 21 : 11;
                player.val = createFrac(Math.floor(Math.random() * maxR));
                changed = true;
            }

            if (changed) {
                if (item.type === 'M-3') score += 20;
                else if (item.type === 'N-2') score += 12;
                else score += 3;

                playerItems.splice(index, 1);
                updateInfo();
                
                if(item.type === 'M-3') checkItemPickupAt(player.x, player.y);
                
                if (player.x === goal.x && player.y === goal.y && isEqual(player.val, goal.val)) {
                    checkWin();
                }
            }
        }

        function getValidItemMoves(item) {
            let moves = [];
            const cx = player.x;
            const cy = player.y;

            if (item.type === 'M-1') {
                const directions = [];
                if (item.data.axis === 'VERT') {
                    directions.push({dx: 0, dy: -1}); // UP
                    directions.push({dx: 0, dy: 1});  // DOWN
                } else {
                    directions.push({dx: -1, dy: 0}); // LEFT
                    directions.push({dx: 1, dy: 0});  // RIGHT
                }

                directions.forEach(d => {
                    for (let i = 1; i < BOARD_SIZE; i++) {
                        let nx = cx + d.dx * i;
                        let ny = cy + d.dy * i;
                        if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                            moves.push({x: nx, y: ny});
                        } else {
                            break; 
                        }
                    }
                });
            } else if (item.type === 'M-2') {
                const jumps = [
                    {dx:1, dy:-2}, {dx:2, dy:-1}, {dx:2, dy:1}, {dx:1, dy:2},
                    {dx:-1, dy:2}, {dx:-2, dy:1}, {dx:-2, dy:-1}, {dx:-1, dy:-2}
                ];
                jumps.forEach(j => {
                    let nx = cx + j.dx;
                    let ny = cy + j.dy;
                    if(nx>=0 && nx<BOARD_SIZE && ny>=0 && ny<BOARD_SIZE) {
                        moves.push({x: nx, y: ny});
                    }
                });
            } else if (item.type === 'M-4') {
                const diags = [
                    {dx: -1, dy: -1}, {dx: 1, dy: -1},
                    {dx: -1, dy: 1},  {dx: 1, dy: 1}
                ];
                
                diags.forEach(d => {
                    for (let i = 1; i < BOARD_SIZE; i++) {
                        let nx = cx + d.dx * i;
                        let ny = cy + d.dy * i;
                        if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                            moves.push({x: nx, y: ny});
                        } else {
                            break; 
                        }
                    }
                });
            }
            return moves;
        }

        function checkItemPickupAt(x, y) {
            const itemIndex = itemsOnBoard.findIndex(it => it.x === x && it.y === y);
            if (itemIndex !== -1) {
                if (playerItems.length < 8) {
                    playerItems.push(generateRandomItem());
                    itemsOnBoard.splice(itemIndex, 1);
                    updateItems();
                }
            }
        }

        function getValidMoves(cx, cy) {
            let moves = [];
            const directions = [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
            directions.forEach(dir => {
                for (let dist = 1; dist < BOARD_SIZE; dist++) {
                    let nx = cx + (dir.dx * dist);
                    let ny = cy + (dir.dy * dist);
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                        moves.push({ dx: dir.dx * dist, dy: dir.dy * dist });
                    }
                }
            });
            return moves;
        }

        function createBoardDOM() {
            boardEl.innerHTML = '';

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${x}-${y}`;
                    
                    const left = PADDING + x * (CELL_SIZE + GAP);
                    const top = PADDING + y * (CELL_SIZE + GAP);
                    cell.style.left = `${left}px`;
                    cell.style.top = `${top}px`;

                    if (x === goal.x && y === goal.y) {
                        cell.classList.add('goal');
                    }

                    cell.onclick = () => handleCellClick(x, y);

                    boardEl.appendChild(cell);
                }
            }

            // UIレイヤーはHTMLに静的に記述してあるので、ここでは盤面（セル）だけを再生成する
            // オーバーレイなどを消さないように注意

            playerPieceEl = document.createElement('div');
            playerPieceEl.className = 'player-piece';
            playerPieceEl.onclick = (e) => {
                e.stopPropagation();
                togglePlayerSelection();
            };
            boardEl.appendChild(playerPieceEl);
        }

        function updateBoardState() {
            const px = PADDING + player.x * (CELL_SIZE + GAP);
            const py = PADDING + player.y * (CELL_SIZE + GAP);
            const scale = isPlayerSelected ? 'scale(1.1)' : 'scale(1)';
            playerPieceEl.style.transform = `translate(${px}px, ${py}px) ${scale}`;
            
            if (isPlayerSelected) playerPieceEl.classList.add('selected');
            else playerPieceEl.classList.remove('selected');
            
            playerPieceEl.innerHTML = renderNumberToHTML(player.val);

            let highlightMap = new Map();
            
            if (activeItemIndex !== -1) {
                const item = playerItems[activeItemIndex];
                const validMoves = getValidItemMoves(item);
                validMoves.forEach(m => {
                    highlightMap.set(`${m.x},${m.y}`, { symbol: '', number: '', colorClass: 'hl-item' });
                });
            } else if (isPlayerSelected && !isGameClear && !isGameOver) {
                // オーバーレイ表示中はハイライトしない
                if (document.getElementById('mode-select-overlay').style.display !== 'flex' && !isCountingDown) {
                    let possibleMoves = getValidMoves(player.x, player.y);
                    possibleMoves.forEach(move => {
                        let tx = player.x + move.dx;
                        let ty = player.y + move.dy;
                        let dist = Math.abs(move.dx + move.dy);
                        let symbol = "", colorClass = "";
                        if (move.dy < 0) { colorClass = 'hl-up';    symbol = "×"; }
                        else if (move.dy > 0) { colorClass = 'hl-down';  symbol = "÷"; }
                        else if (move.dx > 0) { colorClass = 'hl-right'; symbol = "＋"; }
                        else if (move.dx < 0) { colorClass = 'hl-left';  symbol = "－"; }
                        highlightMap.set(`${tx},${ty}`, { symbol, number: dist, colorClass });
                    });
                }
            }

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    if (!cell) continue;
                    
                    cell.className = 'cell'; 
                    cell.innerHTML = ''; 

                    if (x === goal.x && y === goal.y) {
                        cell.classList.add('goal');
                        const isPlayerOnGoal = (x === player.x && y === player.y);
                        const highlightInfo = highlightMap.get(`${x},${y}`);
                        
                        const showGoalValue = !isPlayerOnGoal && (!highlightInfo || highlightInfo.colorClass === 'hl-item');

                        if (showGoalValue) {
                            const content = document.createElement('div');
                            content.className = 'cell-content';
                            content.innerHTML = renderNumberToHTML(goal.val);
                            cell.appendChild(content);
                        }
                    }

                    if (currentGameMode === 'arcade') {
                        const item = itemsOnBoard.find(i => i.x === x && i.y === y);
                        if (item) {
                            const itemDiv = document.createElement('div');
                            itemDiv.className = 'item-icon';
                            itemDiv.innerHTML = getItemIconHTML();
                            cell.appendChild(itemDiv);
                        }
                    }

                    const highlightInfo = highlightMap.get(`${x},${y}`);
                    if (highlightInfo) {
                        cell.classList.add('highlight');
                        cell.classList.add(highlightInfo.colorClass);

                        const previewDiv = document.createElement('div');
                        previewDiv.className = 'preview-overlay';
                        
                        if (highlightInfo.symbol) {
                            const symSpan = document.createElement('span');
                            symSpan.className = 'p-sym';
                            symSpan.textContent = highlightInfo.symbol;
                            const numSpan = document.createElement('span');
                            numSpan.className = 'p-num';
                            numSpan.textContent = highlightInfo.number;
                            previewDiv.appendChild(symSpan);
                            previewDiv.appendChild(numSpan);
                        }

                        cell.appendChild(previewDiv);
                    }
                }
            }
        }

        function updateInfo() {
            currentIconEl.innerHTML = renderNumberToHTML(player.val);
            targetIconEl.innerHTML = renderNumberToHTML(goal.val);
            scoreValEl.textContent = score;

            movesGridEl.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const dot = document.createElement('div');
                dot.className = 'move-dot';
                if (currentGameMode === 'normal') {
                    if (i < moveCount) dot.classList.add('active');
                    if (i === 7 && moveCount > 8) dot.textContent = '+';
                } else {
                    if (i < remainingMoves) dot.classList.add('active');
                }
                movesGridEl.appendChild(dot);
            }
        }

        function addHistory(symbol, num, direction) {
            let symChar = symbol;
            if(symbol === "×") symChar = "×"; 
            if(symbol === "÷") symChar = "÷";
            if(symbol === "+") symChar = "＋"; 
            if(symbol === "-") symChar = "－"; 

            let colorClass = "";
            if (direction === 'up') colorClass = "hist-up";
            else if (direction === 'down') colorClass = "hist-down";
            else if (direction === 'left') colorClass = "hist-left";
            else if (direction === 'right') colorClass = "hist-right";

            const el = document.createElement('div');
            el.className = `history-item ${colorClass}`;
            el.innerHTML = `<span class="h-sym">${symChar}</span><span class="h-num">${num}</span>`;
            
            if (currentGameMode === 'arcade') {
                if (historyGridEl.children.length >= 8) {
                    historyGridEl.removeChild(historyGridEl.firstElementChild);
                }
            }
            historyGridEl.appendChild(el);
        }

        function togglePlayerSelection() {
            if (isGameClear || isGameOver || isCountingDown) return;
            // オーバーレイ表示中は操作不可
            if (document.getElementById('mode-select-overlay').style.display === 'flex') return;

            if (activeItemIndex !== -1) {
                activeItemIndex = -1;
                updateItems();
            }
            isPlayerSelected = !isPlayerSelected;
            updateBoardState();
        }

        function handleCellClick(x, y) {
            if (isGameClear || isGameOver || isCountingDown) return;
            // オーバーレイ表示中は操作不可
            if (document.getElementById('mode-select-overlay').style.display === 'flex') return;

            const cell = document.getElementById(`cell-${x}-${y}`);
            
            if (cell.classList.contains('highlight')) {
                if (activeItemIndex !== -1) {
                    const item = playerItems[activeItemIndex];
                    if (item.type === 'M-1' || item.type === 'M-4') {
                        const dx = x - player.x;
                        const dy = y - player.y;
                        const dist = Math.max(Math.abs(dx), Math.abs(dy));
                        const sx = dx === 0 ? 0 : dx / Math.abs(dx);
                        const sy = dy === 0 ? 0 : dy / Math.abs(dy);
                        
                        for(let i=1; i<=dist; i++){
                            checkItemPickupAt(player.x + sx*i, player.y + sy*i);
                        }
                    } else {
                        checkItemPickupAt(x, y);
                    }

                    player.x = x;
                    player.y = y;
                    
                    score += 3; 

                    playerItems.splice(activeItemIndex, 1);
                    activeItemIndex = -1;
                    
                    updateBoardState();
                    updateItems();
                    updateInfo();
                    
                    if (player.x === goal.x && player.y === goal.y && isEqual(player.val, goal.val)) {
                        checkWin();
                    }
                    
                } else {
                    executeMove(x, y);
                }
            } else if (isPlayerSelected) {
                isPlayerSelected = false;
                updateBoardState();
            } else if (activeItemIndex !== -1) {
                activeItemIndex = -1;
                updateItems();
                updateBoardState();
            }
        }

        function executeMove(tx, ty) {
            const ox = player.x;
            const oy = player.y;
            
            let dx = tx - player.x;
            let dy = ty - player.y;
            let dist = Math.abs(dx + dy);
            
            let symbol = "";
            let dir = "";

            if (dy < 0) { 
                player.val = mul(player.val, dist); 
                symbol = "×"; dir = "up";
            } else if (dy > 0) { 
                player.val = div(player.val, dist); 
                symbol = "÷"; dir = "down";
            } else if (dx > 0) { 
                player.val = add(player.val, dist); 
                symbol = "＋"; dir = "right";
            } else if (dx < 0) { 
                player.val = sub(player.val, dist); 
                symbol = "－"; dir = "left";
            }

            addHistory(symbol, dist, dir);

            if (currentGameMode === 'arcade') {
                const stepX = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
                const stepY = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
                
                for (let i = 1; i <= dist; i++) {
                    checkItemPickupAt(ox + stepX * i, oy + stepY * i);
                }
            }

            player.x = tx;
            player.y = ty;
            
            if (currentGameMode === 'normal') {
                moveCount++;
            } else {
                remainingMoves--;
                score += 10;
            }
            
            isPlayerSelected = false;

            updateBoardState();
            updateInfo();
            
            if (player.x === goal.x && player.y === goal.y && isEqual(player.val, goal.val)) {
                checkWin();
                return; 
            }

            if (currentGameMode === 'arcade' && remainingMoves <= 0) {
                gameOver();
            }
        }

        function checkWin() {
            isGameClear = true;
            
            if (currentGameMode === 'normal') {
                msgMainEl.textContent = "CLEAR!";
                msgSubEl.textContent = "";
                msgSubEl.style.display = 'none'; 
                btnRetryEl.classList.add('hidden');
                btnShareEl.classList.add('hidden');
                messageEl.classList.remove('gameover');
                messageEl.style.display = 'flex';
            } else if (currentGameMode === 'arcade') {
                score += 50;
                updateInfo();
                msgMainEl.textContent = "NEXT!";
                msgSubEl.textContent = "";
                msgSubEl.style.display = 'none'; 
                messageEl.classList.remove('gameover');
                messageEl.style.display = 'flex';
                
                remainingMoves = Math.min(8, remainingMoves + 3);
                
                setTimeout(() => setupArcadeNextStage(), 1000); 
            }
        }

        function isReachableInOneMove(sx, sy, sVal, tx, ty, tVal) {
            if (sx === tx && sy === ty) return true;
            if (sx !== tx && sy !== ty) return false;

            let dist = Math.abs((tx - sx) + (ty - sy));
            let predictedVal = { n: sVal.n, d: sVal.d };

            if (ty < sy) predictedVal = mul(predictedVal, dist);
            else if (ty > sy) predictedVal = div(predictedVal, dist);
            else if (tx > sx) predictedVal = add(predictedVal, dist);
            else if (tx < sx) predictedVal = sub(predictedVal, dist);

            return isEqual(predictedVal, tVal);
        }

        // --- 盤面生成ロジック（上級モード対応） ---
        
        function getStepCount() {
            if (!isAdvancedMode) {
                // 通常モード: 2~4手 (従来通り)
                return Math.floor(Math.random() * 3) + 2; 
            } else {
                // 上級モード: 2~6手 (3,4,5手が多め)
                const p = Math.random();
                if (p < 0.15) return 2;
                if (p < 0.40) return 3;
                if (p < 0.70) return 4;
                if (p < 0.85) return 5;
                return 6;
            }
        }

        function isValidPath(moves) {
            if (!isAdvancedMode) return true; 

            // 「×1」「÷1」判定関数: dx=0 (縦移動) かつ dist=1
            const isOpOne = (m) => {
                const dist = Math.abs(m.dx + m.dy);
                return m.dx === 0 && dist === 1;
            };

            if (moves.length === 2) {
                // 2手の場合: x1, /1 を含んではならない
                if (moves.some(isOpOne)) return false;
            } else {
                // 3手以上の場合: x1, /1 が3連続してはならない
                for (let i = 0; i < moves.length - 2; i++) {
                    if (isOpOne(moves[i]) && isOpOne(moves[i+1]) && isOpOne(moves[i+2])) {
                        return false;
                    }
                }
            }
            return true;
        }

        function generateLevel() {
            const maxVal = isAdvancedMode ? 20 : 10;
            
            // 試行回数上限
            for (let attempt = 0; attempt < 1000; attempt++) {
                let startX = Math.floor(Math.random() * BOARD_SIZE);
                let startY = Math.floor(Math.random() * BOARD_SIZE);
                let startNum = Math.floor(Math.random() * (maxVal + 1));

                let tempPos = { x: startX, y: startY };
                let tempVal = createFrac(startNum);
                
                let steps = getStepCount();
                let movesHistory = [];
                let success = true;

                for (let i = 0; i < steps; i++) {
                    let validMoves = getValidMoves(tempPos.x, tempPos.y);
                    if (validMoves.length === 0) { success = false; break; }
                    
                    let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    let dist = Math.abs(move.dx + move.dy);

                    if (move.dy < 0) tempVal = mul(tempVal, dist);
                    else if (move.dy > 0) tempVal = div(tempVal, dist);
                    else if (move.dx > 0) tempVal = add(tempVal, dist);
                    else if (move.dx < 0) tempVal = sub(tempVal, dist);

                    tempPos.x += move.dx;
                    tempPos.y += move.dy;
                    movesHistory.push(move);
                }

                if (success) {
                    if ((tempPos.x !== startX || tempPos.y !== startY) && 
                        isInteger(tempVal) && 
                        tempVal.n >= 0 && tempVal.n <= maxVal &&
                        !isReachableInOneMove(startX, startY, createFrac(startNum), tempPos.x, tempPos.y, tempVal) &&
                        isValidPath(movesHistory)) {
                        
                        player = { x: startX, y: startY, val: createFrac(startNum) };
                        goal = { x: tempPos.x, y: tempPos.y, val: tempVal };
                        return true;
                    }
                }
            }
            return false;
        }

        function generateNextGoal() {
            const maxVal = isAdvancedMode ? 20 : 10;
            let startX = player.x;
            let startY = player.y;
            let startVal = player.val;

            for(let attempt=0; attempt<1000; attempt++) {
                let tempPos = { x: startX, y: startY };
                let tempVal = { n: startVal.n, d: startVal.d };
                
                let steps = getStepCount();
                let movesHistory = [];
                let success = true;

                for (let i = 0; i < steps; i++) {
                    let validMoves = getValidMoves(tempPos.x, tempPos.y);
                    if (validMoves.length === 0) { success = false; break; }
                    
                    let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    let dist = Math.abs(move.dx + move.dy);

                    if (move.dy < 0) tempVal = mul(tempVal, dist);
                    else if (move.dy > 0) tempVal = div(tempVal, dist);
                    else if (move.dx > 0) tempVal = add(tempVal, dist);
                    else if (move.dx < 0) tempVal = sub(tempVal, dist);

                    tempPos.x += move.dx;
                    tempPos.y += move.dy;
                    movesHistory.push(move);
                }

                let conflict = itemsOnBoard.some(it => it.x === tempPos.x && it.y === tempPos.y);

                if (success && !conflict &&
                   (tempPos.x !== startX || tempPos.y !== startY) && 
                   isInteger(tempVal) && 
                   tempVal.n >= 0 && tempVal.n <= maxVal &&
                   !isReachableInOneMove(startX, startY, startVal, tempPos.x, tempPos.y, tempVal) &&
                   isValidPath(movesHistory)) {
                    
                    goal = { x: tempPos.x, y: tempPos.y, val: tempVal };
                    return true;
                }
            }
            
            // フォールバック: どうしても見つからない場合はランダム配置 (従来のロジック)
            let attemptsFallback = 0;
            do {
                goal.x = Math.floor(Math.random() * BOARD_SIZE);
                goal.y = Math.floor(Math.random() * BOARD_SIZE);
                goal.val = createFrac(Math.floor(Math.random() * (maxVal + 1)));
                
                let conflictPlayer = (goal.x === startX && goal.y === startY);
                let conflictItem = itemsOnBoard.some(it => it.x === goal.x && it.y === goal.y);
                
                if (!conflictPlayer && !conflictItem) break;
                attemptsFallback++;
            } while(attemptsFallback < 100);
            
            return true;
        }

        function setupArcadeNextStage() {
            generateNextGoal();
            spawnItems();
            historyGridEl.innerHTML = ''; 
            updateBoardState();
            updateInfo();
            updateItems(); 
            messageEl.style.display = 'none';
            isGameClear = false;
        }
    </script>
